# fly.toml app configuration file generated for agents-codes on 2025-09-16
# Learn more at https://fly.io/docs/reference/configuration/

app = "agents-codes"
primary_region = "iad" # Change to your closest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/agent.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[mounts]]
  source = "data"
  destination = "/data"
